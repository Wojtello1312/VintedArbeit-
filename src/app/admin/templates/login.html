{% extends 'base.html' %}
{% block content %}
<div class="mx-auto max-w-md py-8 sm:py-16">
  <p class="mb-3 text-sm font-medium uppercase tracking-widest text-emerald-800">Dostęp administratora</p>
  <h1>Twoje centrum okazji</h1><p class="mt-3 text-slate-500">Zaloguj się, aby przeglądać oferty i zarządzać analizą.</p>
  <form action="/admin/login" method="post" class="card mt-8 space-y-5 p-6">
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Login<input name="username" autocomplete="username" required maxlength="100" autofocus></label>
    <label>Hasło<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
    <button class="button w-full" type="submit">Zaloguj się <span aria-hidden="true">→</span></button>
  </form>
</div>
{% endblock %}
