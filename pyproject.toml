[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vinted-deal-hunter"
version = "0.1.0"
description = "Offline-first ingestion of authorized offer data"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "portalocker>=3.2,<4",
  "apscheduler>=3.11,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "rapidfuzz>=3.12,<4",
  "sqlalchemy>=2.0.38,<2.1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]

[project.scripts]
deal-hunter = "vinted_deal_hunter.cli:main"
vinted-scraper = "vinted_deal_hunter.vinted_scraper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vinted_deal_hunter", "src/app"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
